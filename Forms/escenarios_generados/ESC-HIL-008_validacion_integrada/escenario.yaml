  deriva_de: ESC-HIL-003_consolidado_rev5
  esquema_datos: consolidado_rev5
  cambios_respecto_al_origen: ventana 10:00, duracion 480 s (D-28), programa de carga
    con rampa, escalon negativo, rampa de subida en el sombreado y rampa de bajada
    en la recuperacion; sombreado solar en rampa y escalon; perfil de contingencias
    con perdida y desconexion; bloque regimen_excedente v2 con dos ventanas.
  equivalencia: no aplica; es el escenario unico que sustituye como base citable a
    ESC-HIL-001, 003, 005, 006, 007 y a la campana 20261108T170925.
