descripcion: Escenario unico de validacion de 480 s (961 muestras a 2 Hz) que reune
  en una sola corrida las situaciones del capitulo 8 -consenso inicial, seguimiento
  de carga, dos episodios de excedente (absorcion en BESS y recorte solar), dos de
  deficit (moderado y severo), perdida de paquetes del 20% y desconexion total de
  un enlace durante 30 s-. Base citable de D-28.
