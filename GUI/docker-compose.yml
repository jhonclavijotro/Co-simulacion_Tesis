# Manifiesto Autogenerado de Co-Simulación Docker (Separación Estricta de Procesos y Emulación de Red)
version: '3.8'

networks:
  microgrid_net:
    driver: bridge

services:
  nodo_1_dinamica:
    build:
      context: .
      dockerfile: Docker/Dockerfile.dynamic
    container_name: nodo_1_dinamica
    environment:
      - NODE_ID=1
      - SOURCE_TYPE=DIESEL
      - HOLD_MODE=ZOH
      - ZFOH_LAMBDA=0.7
      - MASTER_CLOCK_HOST=192.168.1.100
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256m
    networks:
      - microgrid_net

  nodo_1_agente:
    build:
      context: .
      dockerfile: Docker/Dockerfile.agent
    container_name: nodo_1_agente
    environment:
      - NODE_ID=1
      - OPERATING_MODE=ONLINE
      - NETWORK_PROFILE=IDEAL
      - NETWORK_DELAY_MS=0.0
      - PACKET_LOSS_RATE=0.0
      - TIMEOUT_STEPS=4
      - HOLD_MODE=ZOH
      - ZFOH_LAMBDA=0.7
      - MASTER_CLOCK_HOST=192.168.1.100
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256m
    networks:
      - microgrid_net

